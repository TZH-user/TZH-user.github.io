<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-monospace,Consolas,monospace" role="img" aria-label="仪器自动化控制台架构：人工与 AI 双入口，经统一后端与 VISA/SCPI 会话驱动局域网仪器，质量判决内核闭环校验">
  <rect width="960" height="520" fill="#0f1420"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d17e"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 入口层 -->
  <g>
    <rect x="30" y="30" width="260" height="64" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="160" y="56" text-anchor="middle" fill="#e8edf4" font-size="14">人工 · Web 控制台</text>
    <text x="160" y="78" text-anchor="middle" fill="#7f8da0" font-size="11">127.0.0.1:8765 / 串口收发 / 日志导出</text>

    <rect x="670" y="30" width="260" height="64" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="800" y="56" text-anchor="middle" fill="#e8edf4" font-size="14">AI / 脚本 · CLI + HTTP API</text>
    <text x="800" y="78" text-anchor="middle" fill="#7f8da0" font-size="11">dg4062_app.cli · /api/channel/1/apply</text>
  </g>

  <line x1="160" y1="94" x2="380" y2="150" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="800" y1="94" x2="580" y2="150" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 后端层 -->
  <rect x="180" y="150" width="600" height="150" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="480" y="176" text-anchor="middle" fill="#34d17e" font-size="13">统一后端（人工与 AI 共用同一进程）</text>
  <g font-size="12">
    <rect x="205" y="195" width="165" height="76" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="287" y="222" text-anchor="middle" fill="#e8edf4">instrument.py</text>
    <text x="287" y="242" text-anchor="middle" fill="#7f8da0" font-size="11">VISA/SCPI 会话</text>
    <text x="287" y="258" text-anchor="middle" fill="#7f8da0" font-size="11">INSTR↔SOCKET 回退</text>

    <rect x="398" y="195" width="165" height="76" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="480" y="222" text-anchor="middle" fill="#e8edf4">调制双层校验</text>
    <text x="480" y="242" text-anchor="middle" fill="#7f8da0" font-size="11">前端基础检查 +</text>
    <text x="480" y="258" text-anchor="middle" fill="#7f8da0" font-size="11">仪器实时 MIN/MAX</text>

    <rect x="591" y="195" width="165" height="76" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="673" y="222" text-anchor="middle" fill="#e8edf4">quality.py</text>
    <text x="673" y="242" text-anchor="middle" fill="#7f8da0" font-size="11">PASS / WARN / FAIL</text>
    <text x="673" y="258" text-anchor="middle" fill="#7f8da0" font-size="11">削顶·点数·频率·Vpp</text>
  </g>

  <!-- 写入门禁 -->
  <path d="M480 300 v28 h-330 v-40" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <text x="322" y="342" text-anchor="middle" fill="#f59e0b" font-size="11">写入门禁：prepare → confirmation_required → 逐字回填 apply</text>

  <!-- SCPI 通道 -->
  <line x1="480" y1="300" x2="480" y2="356" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="356" width="360" height="40" rx="8" fill="#10141b" stroke="#222c3a"/>
  <text x="480" y="381" text-anchor="middle" fill="#e8edf4" font-size="13">VISA / SCPI over LAN（TCPIP）</text>

  <!-- 仪器层 -->
  <g font-size="12">
    <line x1="480" y1="396" x2="130" y2="436" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="480" y1="396" x2="365" y2="436" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="480" y1="396" x2="600" y2="436" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="480" y1="396" x2="835" y2="436" stroke="#34d17e" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="30" y="436" width="200" height="56" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="130" y="460" text-anchor="middle" fill="#e8edf4">RIGOL DG4062</text>
    <text x="130" y="478" text-anchor="middle" fill="#7f8da0" font-size="11">波形发生器 · AM/FM/PM/ASK/FSK/PSK</text>

    <rect x="265" y="436" width="200" height="56" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="365" y="460" text-anchor="middle" fill="#e8edf4">RIGOL DS4014E</text>
    <text x="365" y="478" text-anchor="middle" fill="#7f8da0" font-size="11">示波器 · 波形读取/CSV 导出</text>

    <rect x="500" y="436" width="200" height="56" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="600" y="460" text-anchor="middle" fill="#e8edf4">Tektronix MSO4104B</text>
    <text x="600" y="478" text-anchor="middle" fill="#7f8da0" font-size="11">示波器 · SKILL 安全流程</text>

    <rect x="735" y="436" width="200" height="56" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="835" y="460" text-anchor="middle" fill="#e8edf4">Keysight E8267D</text>
    <text x="835" y="478" text-anchor="middle" fill="#7f8da0" font-size="11">矢量信号源 · 数字调制验证</text>
  </g>
</svg>
