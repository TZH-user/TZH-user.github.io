<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-monospace,Consolas,monospace" role="img" aria-label="aggregate-search MCP 架构：stdio MCP 服务并行查询五引擎，失败引擎进 300 秒健康黑名单，加权 RRF 融合去重后返回 top-K">
  <rect width="960" height="520" fill="#0f1420"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d17e"/>
    </marker>
    <marker id="bb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- MCP 客户端 -->
  <rect x="30" y="210" width="180" height="84" rx="10" fill="#10141b" stroke="#222c3a"/>
  <text x="120" y="242" text-anchor="middle" fill="#e8edf4" font-size="13">MCP 客户端</text>
  <text x="120" y="264" text-anchor="middle" fill="#7f8da0" font-size="11">ZCode / Claude Code</text>
  <text x="120" y="281" text-anchor="middle" fill="#7f8da0" font-size="11">stdio</text>

  <line x1="210" y1="252" x2="266" y2="252" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- server -->
  <rect x="270" y="196" width="150" height="112" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="345" y="230" text-anchor="middle" fill="#34d17e" font-size="13">server.py</text>
  <text x="345" y="254" text-anchor="middle" fill="#e8edf4" font-size="12">web_search</text>
  <text x="345" y="272" text-anchor="middle" fill="#e8edf4" font-size="12">engine_status</text>
  <text x="345" y="294" text-anchor="middle" fill="#7f8da0" font-size="11">orchestrator</text>
  <text x="345" y="300" text-anchor="middle" fill="#7f8da0" font-size="7"> </text>

  <!-- 引擎列 -->
  <g font-size="12">
    <line x1="420" y1="230" x2="520" y2="86"  stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="420" y1="240" x2="520" y2="158" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="420" y1="266" x2="520" y2="266" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="420" y1="292" x2="520" y2="374" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="420" y1="300" x2="520" y2="446" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>

    <rect x="524" y="56"  width="210" height="58" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="629" y="80" text-anchor="middle" fill="#e8edf4">博查 Bocha</text>
    <text x="629" y="99" text-anchor="middle" fill="#7f8da0" font-size="11">中文主力 · 直连 · zh 权重 ×1.3</text>

    <rect x="524" y="130" width="210" height="58" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="629" y="154" text-anchor="middle" fill="#e8edf4">智谱 BigModel</text>
    <text x="629" y="173" text-anchor="middle" fill="#7f8da0" font-size="11">GLM 生态 · 直连 · zh 权重 ×1.3</text>

    <rect x="524" y="238" width="210" height="58" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="629" y="262" text-anchor="middle" fill="#e8edf4">SearXNG（可选自托管）</text>
    <text x="629" y="281" text-anchor="middle" fill="#7f8da0" font-size="11">免 key</text>

    <rect x="524" y="346" width="210" height="58" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="629" y="370" text-anchor="middle" fill="#e8edf4">Tavily</text>
    <text x="629" y="389" text-anchor="middle" fill="#7f8da0" font-size="11">海外 · 出网代理 · en ×1.3</text>

    <rect x="524" y="418" width="210" height="58" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="629" y="442" text-anchor="middle" fill="#e8edf4">Serper</text>
    <text x="629" y="461" text-anchor="middle" fill="#7f8da0" font-size="11">Google SERP · 海外代理</text>
  </g>

  <!-- 健康黑名单回环 -->
  <path d="M524 300 h-60 q-24 0 -24 24 v88 q0 24 24 24 h44" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#bb)"/>
  <text x="330" y="430" text-anchor="middle" fill="#f59e0b" font-size="11">失败引擎 → 300s 健康黑名单</text>
  <text x="330" y="448" text-anchor="middle" fill="#f59e0b" font-size="11">失败分类：quota/auth/network/timeout…</text>

  <!-- 融合 -->
  <line x1="734" y1="262" x2="796" y2="262" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="800" y="150" width="130" height="230" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="865" y="182" text-anchor="middle" fill="#34d17e" font-size="13">fusion.py</text>
  <g font-size="11" fill="#e8edf4">
    <text x="865" y="216" text-anchor="middle">URL 规范化</text>
    <text x="865" y="236" text-anchor="middle">去重</text>
    <text x="865" y="270" text-anchor="middle">加权 RRF</text>
    <text x="865" y="290" text-anchor="middle" font-size="10" fill="#7f8da0">Σ w/(60+rank)</text>
    <text x="865" y="324" text-anchor="middle">跨源命中加分</text>
    <text x="865" y="348" text-anchor="middle" font-size="10" fill="#7f8da0">engines 字段标注</text>
  </g>

  <line x1="865" y1="150" x2="865" y2="96" stroke="#34d17e" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="796" y="40" width="140" height="56" rx="8" fill="#10141b" stroke="#222c3a"/>
  <text x="866" y="64" text-anchor="middle" fill="#e8edf4" font-size="13">top-K 结果</text>
  <text x="866" y="83" text-anchor="middle" fill="#7f8da0" font-size="11">+ engine_errors</text>
</svg>
