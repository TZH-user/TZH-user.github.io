<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-monospace,Consolas,monospace" role="img" aria-label="无线自动收发装置信号链：IQ 双 ADC 采集，粗扫细扫两级锁定，特征判决调制类型，LVGL 与串口输出">
  <rect width="960" height="540" fill="#0f1420"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d17e"/>
    </marker>
    <marker id="cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 输入 -->
  <rect x="30" y="120" width="140" height="120" rx="10" fill="#10141b" stroke="#222c3a"/>
  <text x="100" y="158" text-anchor="middle" fill="#e8edf4" font-size="13">RF 输入</text>
  <text x="100" y="180" text-anchor="middle" fill="#7f8da0" font-size="11">30 ~ 50 MHz 实验档</text>
  <text x="100" y="198" text-anchor="middle" fill="#7f8da0" font-size="11">扫频窗 29 ~ 51 MHz</text>
  <text x="100" y="224" text-anchor="middle" fill="#f59e0b" font-size="11">2026 校电赛 F 题</text>

  <line x1="170" y1="180" x2="228" y2="180" stroke="#34d17e" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- ADC -->
  <rect x="232" y="96" width="180" height="168" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="322" y="124" text-anchor="middle" fill="#34d17e" font-size="13">双 ADC 同步采集</text>
  <g font-size="12" fill="#e8edf4">
    <rect x="252" y="140" width="140" height="42" rx="6" fill="#10141b" stroke="#222c3a"/>
    <text x="322" y="157" text-anchor="middle">ADC1 · PC4 → I</text>
    <text x="322" y="174" text-anchor="middle" font-size="10" fill="#7f8da0">ADC1_INP4</text>
    <rect x="252" y="196" width="140" height="42" rx="6" fill="#10141b" stroke="#222c3a"/>
    <text x="322" y="213" text-anchor="middle">ADC2 · PB1 → Q</text>
    <text x="322" y="230" text-anchor="middle" font-size="10" fill="#7f8da0">ADC2_INP5</text>
  </g>
  <text x="322" y="256" text-anchor="middle" fill="#7f8da0" font-size="10">DMA 半/满块中断驱动</text>

  <line x1="412" y1="180" x2="470" y2="180" stroke="#34d17e" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- 扫频锁定 -->
  <rect x="474" y="96" width="220" height="168" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="584" y="124" text-anchor="middle" fill="#34d17e" font-size="13">扫频锁定 app_signal_detect</text>
  <g font-size="11" fill="#e8edf4">
    <text x="584" y="152" text-anchor="middle">① 粗扫：步进 300 kHz</text>
    <text x="584" y="174" text-anchor="middle">② 细扫：±1.2 MHz @ 50 kHz</text>
    <text x="584" y="196" text-anchor="middle">③ 每频点驻留 2 块</text>
    <text x="584" y="218" text-anchor="middle" fill="#7f8da0">Vpp 滑动阈值</text>
    <text x="584" y="236" text-anchor="middle" fill="#7f8da0">VPP_MIN_RISE_RAW=80</text>
  </g>
  <text x="584" y="256" text-anchor="middle" fill="#f59e0b" font-size="10">锁定 → carrier_present</text>

  <line x1="694" y1="180" x2="752" y2="180" stroke="#34d17e" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- 调制识别 -->
  <rect x="756" y="96" width="174" height="168" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="843" y="124" text-anchor="middle" fill="#34d17e" font-size="13">调制识别</text>
  <text x="843" y="144" text-anchor="middle" fill="#7f8da0" font-size="11">app_mod_detect</text>
  <g font-size="11" fill="#e8edf4">
    <text x="843" y="170" text-anchor="middle">env_variation_pm</text>
    <text x="843" y="190" text-anchor="middle">freq_activity / psk_jump</text>
    <text x="843" y="210" text-anchor="middle">fsk_sign_percent</text>
    <text x="843" y="234" text-anchor="middle" fill="#f59e0b">→ CW / AM / FSK / PSK</text>
  </g>

  <!-- 底部输出 -->
  <line x1="843" y1="264" x2="843" y2="330" stroke="#34d17e" stroke-width="1.5"/>
  <line x1="584" y1="264" x2="584" y2="330" stroke="#34d17e" stroke-width="1.5"/>
  <line x1="322" y1="264" x2="322" y2="330" stroke="#34d17e" stroke-width="1.5"/>

  <rect x="192" y="330" width="260" height="64" rx="8" fill="#10141b" stroke="#222c3a"/>
  <text x="322" y="356" text-anchor="middle" fill="#e8edf4" font-size="12">LVGL UI 主卡</text>
  <text x="322" y="376" text-anchor="middle" fill="#7f8da0" font-size="11">载波频率 · 扫频状态 · Vpp · 边界</text>

  <rect x="482" y="330" width="220" height="64" rx="8" fill="#10141b" stroke="#222c3a"/>
  <text x="592" y="356" text-anchor="middle" fill="#e8edf4" font-size="12">算法状态日志（1 s）</text>
  <text x="592" y="376" text-anchor="middle" fill="#7f8da0" font-size="11">sig,… 行 + mod,m=… 行</text>

  <rect x="732" y="330" width="200" height="64" rx="8" fill="#10141b" stroke="#222c3a"/>
  <text x="832" y="356" text-anchor="middle" fill="#e8edf4" font-size="12">待接入：解调 / 频谱</text>
  <text x="832" y="376" text-anchor="middle" fill="#7f8da0" font-size="11">UI 预留区</text>

  <!-- 样本统计框 -->
  <rect x="30" y="330" width="130" height="140" rx="10" fill="#0b0e13" stroke="#f59e0b" stroke-opacity=".5"/>
  <text x="95" y="356" text-anchor="middle" fill="#f59e0b" font-size="12">实测统计</text>
  <g font-size="10" fill="#e8edf4">
    <text x="95" y="378" text-anchor="middle">CW 52 样本</text>
    <text x="95" y="394" text-anchor="middle">env 36~426</text>
    <text x="95" y="418" text-anchor="middle">AM 34 样本</text>
    <text x="95" y="434" text-anchor="middle">env 549~606</text>
    <text x="95" y="458" text-anchor="middle" fill="#34d17e">阈值 450：</text>
    <text x="95" y="474" text-anchor="middle" fill="#34d7e">误报 0% 漏检 0%</text>
  </g>

  <!-- 反馈回路 -->
  <path d="M584 394 v40 h-240 q-24 0 -24 -24 v-14" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cb)"/>
  <text x="470" y="452" text-anchor="middle" fill="#f59e0b" font-size="11">仅 VPP_LOCKED 且 carrier_present 时进入调制识别</text>
</svg>
