<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-monospace,Consolas,monospace" role="img" aria-label="本地 AIGC 素材生产管线：下载脚本带校验地填充模型库，ComfyUI 原生节点跑生图生视频与后处理，QC 脚本把关后出成品">
  <rect width="960" height="540" fill="#0f1420"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d17e"/>
    </marker>
    <marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 下载 -->
  <rect x="30" y="60" width="190" height="120" rx="10" fill="#10141b" stroke="#222c3a"/>
  <text x="125" y="88" text-anchor="middle" fill="#e8edf4" font-size="13">下载脚本</text>
  <g font-size="11" fill="#7f8da0">
    <text x="125" y="112" text-anchor="middle">ModelScope 国内直连</text>
    <text x="125" y="130" text-anchor="middle">GitHub → gh-proxy</text>
    <text x="125" y="154" text-anchor="middle" fill="#34d17e">sha256 ✓ 断点续传</text>
    <text x="125" y="170" text-anchor="middle" fill="#34d17e">重跑自动跳过</text>
  </g>

  <line x1="220" y1="120" x2="278" y2="120" stroke="#34d17e" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- 模型库 -->
  <rect x="282" y="52" width="190" height="136" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="377" y="80" text-anchor="middle" fill="#34d17e" font-size="13">模型库 E:\LLM\Model</text>
  <g font-size="11" fill="#e8edf4">
    <text x="377" y="104" text-anchor="middle">191 GB / 36 文件（NVMe）</text>
    <text x="377" y="126" text-anchor="middle" fill="#7f8da0">Flux.1-dev FP8 · Qwen-Image</text>
    <text x="377" y="144" text-anchor="middle" fill="#7f8da0">Wan2.2-5B fp16 · 14B Q4</text>
    <text x="377" y="162" text-anchor="middle" fill="#7f8da0">MiniMax-H3 int8 20.97 GB</text>
    <text x="377" y="180" text-anchor="middle" fill="#7f8da0">BiRefNet · RIFE · Real-ESRGAN</text>
  </g>

  <line x1="472" y1="120" x2="530" y2="120" stroke="#34d17e" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- ComfyUI -->
  <rect x="534" y="30" width="396" height="270" rx="10" fill="#0b0e13" stroke="#34d17e" stroke-opacity=".55"/>
  <text x="732" y="58" text-anchor="middle" fill="#34d17e" font-size="13">ComfyUI 0.35（全部原生节点）</text>

  <g font-size="11">
    <rect x="556" y="78" width="170" height="60" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="641" y="102" text-anchor="middle" fill="#e8edf4">生图主力</text>
    <text x="641" y="121" text-anchor="middle" fill="#7f8da0">Flux 细节 · Qwen 中文渲染</text>

    <rect x="746" y="78" width="170" height="60" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="831" y="102" text-anchor="middle" fill="#e8edf4">视频主力</text>
    <text x="831" y="121" text-anchor="middle" fill="#7f8da0">Wan2.2-5B 快 · 14B 精</text>

    <rect x="556" y="152" width="170" height="60" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="641" y="176" text-anchor="middle" fill="#e8edf4">H3 R2V 舞蹈管线</text>
    <text x="641" y="195" text-anchor="middle" fill="#7f8da0">turbo 4 步 · 3 参考图 30min/条</text>

    <rect x="746" y="152" width="170" height="60" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="831" y="176" text-anchor="middle" fill="#e8edf4">VACE 兜底路线</text>
    <text x="831" y="195" text-anchor="middle" fill="#7f8da0">Wan2.1 14B Q4 · 动作复刻</text>

    <rect x="556" y="226" width="360" height="54" rx="8" fill="#10141b" stroke="#222c3a"/>
    <text x="736" y="248" text-anchor="middle" fill="#e8edf4">后处理：BiRefNet 抠图 → RIFE 补帧 → Real-ESRGAN 超分</text>
    <text x="736" y="268" text-anchor="middle" fill="#7f8da0">165 个工作流 JSON · ui2api.py 转换器</text>
  </g>

  <text x="732" y="288" text-anchor="middle" fill="#f59e0b" font-size="10">RTX 4060 Ti 16GB · 显存峰值 ≤15.8GB · 9 项部署测试全通过</text>

  <line x1="732" y1="300" x2="732" y2="348" stroke="#34d17e" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- QC -->
  <rect x="534" y="352" width="396" height="72" rx="10" fill="#10141b" stroke="#f59e0b" stroke-opacity=".5"/>
  <text x="732" y="380" text-anchor="middle" fill="#f59e0b" font-size="13">QC 闸门 dance_qc.py</text>
  <g font-size="11" fill="#7f8da0">
    <text x="732" y="402" text-anchor="middle">候选抽 8 帧拼图 · 全帧差分切镜检测 · sheet 对比图</text>
    <text x="732" y="417" text-anchor="middle">身份 / 服装 / 动作 / 背景 / 无切镜 五项目检</text>
  </g>

  <line x1="732" y1="424" x2="732" y2="462" stroke="#34d17e" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- 成品 -->
  <rect x="534" y="466" width="396" height="52" rx="10" fill="#10141b" stroke="#222c3a"/>
  <text x="732" y="488" text-anchor="middle" fill="#e8edf4" font-size="13">成品输出（H.264 + AAC）</text>
  <text x="732" y="507" text-anchor="middle" fill="#7f8da0" font-size="11">768×1344×124f @24fps · 5.17s · 首批出片 QC 全过</text>

  <!-- 左下：素材获取通道 -->
  <rect x="30" y="300" width="440" height="120" rx="10" fill="#10141b" stroke="#222c3a"/>
  <text x="250" y="328" text-anchor="middle" fill="#e8edf4" font-size="13">动作素材获取通道（实测）</text>
  <g font-size="11" fill="#7f8da0">
    <text x="250" y="352" text-anchor="middle">Pexels：www 页限流 ~1min，CDN 不限流</text>
    <text x="250" y="370" text-anchor="middle">→ 文件名规律 + Range 探测直取</text>
    <text x="250" y="394" text-anchor="middle">B 站：buvid3 → 搜索 → cid → dash 480p</text>
    <text x="250" y="410" text-anchor="middle">→ 必带 Referer，选单人全身无切镜</text>
  </g>

  <!-- 连线：模型库→素材通道 淡化关联 -->
  <path d="M125 180 v96" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#db)"/>
  <text x="125" y="290" text-anchor="middle" fill="#f59e0b" font-size="11">R2V 只取动作不取背景</text>
  <line x1="470" y1="360" x2="530" y2="376" stroke="#34d17e" stroke-width="1.5" marker-end="url(#d)"/>
</svg>
